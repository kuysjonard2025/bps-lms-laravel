# Custom log format that explicitly outputs the client's X-Forwarded-For IP address
log_format render_format '$http_x_forwarded_for - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # Apply the custom log format
    access_log /dev/stdout render_format;

    index index.php index.html;

    charset utf-8;

    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
